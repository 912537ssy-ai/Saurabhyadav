<!DOCTYPE html>
<html>
<head>
<title>Saurabh Food</title>
<style>
body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}
.header{
background:red;
color:white;
padding:30px;
text-align:center;
}
.card{
background:white;
margin:15px;
padding:15px;
border-radius:10px;
}
button{
background:red;
color:white;
border:none;
padding:10px;
border-radius:5px;
}
</style>
</head>

<body>

<div class="header">
<h1>Saurabh Food</h1>
<p>Discover the best food near you</p>
<input type="text" placeholder="Search food or restaurant" style="width:80%;padding:10px;border:none;border-radius:5px;">
</div>

<div class="card">
<h2>Pizza Hut</h2>
<p>Rating ⭐ 4.5</p>
<button>Order Now</button>
</div>

<div class="card">
<h2>Burger King</h2>
<p>Rating ⭐ 4.3</p>
<button>Order Now</button>
</div>

</body>
</html>
